name: CI - Lint, Test, Build

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint & Format Check
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort
      
      - name: Black format check
        run: black --check apps/ scripts/ services/
        continue-on-error: true
      
      - name: isort import check
        run: isort --check-only apps/ scripts/ services/
        continue-on-error: true
      
      - name: Flake8 linting
        run: flake8 apps/ scripts/ services/ --max-line-length=120 --ignore=E203,W503
        continue-on-error: true

  test-unit:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=apps/ --cov-report=xml --cov-report=term-missing
        continue-on-error: false
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  test-integration:
    runs-on: ubuntu-latest
    name: Integration Tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gravity_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U test; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
      
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/gravity_test
          REDIS_URL: redis://localhost:6379
        run: pytest tests/api/ tests/integration/ -v --tb=short
        continue-on-error: false

  security-scan:
    runs-on: ubuntu-latest
    name: Security & Dependency Check
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install security tools
        run: |
          python -m pip install bandit safety
      
      - name: Bandit security scan
        run: bandit -r apps/ -f json -o bandit-report.json
        continue-on-error: true
      
      - name: Safety dependency check
        run: safety check --json
        continue-on-error: true
      
      - name: SAST - Code scanning
        uses: github/super-linter@v4
        env:
          VALIDATE_PYTHON: true
          VALIDATE_DOCKERFILE: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true

  docker-build:
    needs: [lint, test-unit, security-scan]
    runs-on: ubuntu-latest
    name: Build Docker Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Log in to Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}/analysis-api
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./deployment/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/analysis-api:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/analysis-api:buildcache,mode=max

  coverage-report:
    needs: test-unit
    runs-on: ubuntu-latest
    name: Coverage Validation (70%+)
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run tests with coverage gate
        run: pytest tests/unit/ -v --cov=apps/ --cov-report=term-missing --cov-fail-under=70

  status-check:
    needs: [lint, test-unit, test-integration, security-scan, coverage-report]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.lint.result }}" == "failure" ]; then
            echo "❌ Linting failed"
            exit 1
          fi
          if [ "${{ needs.test-unit.result }}" == "failure" ]; then
            echo "❌ Unit tests failed"
            exit 1
          fi
          if [ "${{ needs.security-scan.result }}" == "failure" ]; then
            echo "⚠️ Security scan issues (warnings)"
          fi
          if [ "${{ needs.coverage-report.result }}" == "failure" ]; then
            echo "❌ Coverage gate failed (need 70%+)"
            exit 1
          fi
          echo "✅ All checks passed!"
