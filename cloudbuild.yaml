# cloudbuild.yaml - include a step to generate Procfile using a dedicated script
# Replaces fragile inline bash one-liners with a multi-line script for readability and maintainability
steps:
  - id: "create-procfile"
    name: "ubuntu"
    entrypoint: "bash"
    args:
      - -c
      - "chmod +x scripts/create-procfile.sh && ./scripts/create-procfile.sh"

