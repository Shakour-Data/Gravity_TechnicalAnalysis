[pytest]
testpaths = 
    apps/analysis_api/tests
    services/data_ingestion/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = 
    apps/analysis_api/src
    apps/data_pipeline/src
    services/data_ingestion
asyncio_mode = auto

# Phase 4: Enhanced test configuration with coverage gates
addopts = 
    --asyncio-mode=auto
    --strict-markers
    --tb=short
    -v
    --cov=apps/analysis_api/src/gravity_tech/core
    --cov=apps/analysis_api/src/gravity_tech/analysis
    --cov=apps/analysis_api/src/gravity_tech/api
    --cov=apps/analysis_api/src/gravity_tech/database
    --cov=services/data_ingestion/src
    --cov-report=html
    --cov-report=term-missing
    --cov-report=json
    --cov-fail-under=0
    --cov-branch

# Test markers
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (with DB/cache)
    e2e: End-to-end tests (complete flows)
    security: Security tests (OWASP Top 10)
    slow: Slow tests (optional skip with -m 'not slow')
    asyncio: Async tests
    fast: Fast tests
    fibonacci: Fibonacci analysis tests
    backtesting: Backtesting tests

# Coverage configuration
[coverage:run]
branch = True
omit =
    */tests/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
