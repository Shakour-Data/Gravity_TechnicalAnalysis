version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bedaan4d_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Bedaan4D
      POSTGRES_DB: bedaan4d_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bedaan4d_network

  redis:
    image: redis:7-alpine
    container_name: bedaan4d_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bedaan4d_network

  gravity-tech-analysis:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile
    container_name: gravity_tech_analysis
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bedaan4d_network
    restart: unless-stopped

networks:
  bedaan4d_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
